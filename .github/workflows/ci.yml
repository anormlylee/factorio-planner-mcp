name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm run build:worker
      - run: npm run build:self
      - name: Test actual Workers runtime
        shell: bash
        run: |
          npm run dev:worker -- --port 8787 > worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null; then break; fi
            sleep 1
          done
          npm run test:worker || { cat worker.log; exit 1; }
